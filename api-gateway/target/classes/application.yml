server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:http://localhost:5173}"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates: [Path=/api/auth/**]
        - id: room-service
          uri: lb://ROOM-SERVICE
          predicates: [Path=/api/rooms/**]
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates: [Path=/api/bookings/**]
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates: [Path=/api/payments/**]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
