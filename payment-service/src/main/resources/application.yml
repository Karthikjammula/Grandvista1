server:
  port: ${PORT:8084}
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:file:./data/paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
jwt:
  secret: ${JWT_SECRET:GrandVistaSuperSecretKey-ChangeThis-AtLeast32Chars!}
